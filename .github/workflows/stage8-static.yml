name: Stage 8 static checks
on:
  push:
    branches: [claude/stage8-cms-admin, 'feat/**']
  pull_request:
    branches: [claude/stage8-cms-admin, 'feat/**']
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check admin/admin.js
          node --check cms-public.js
          node --check cms-boot.js
      - name: Run admin static security checks
        run: node --test tests/admin-static.test.js
      - name: Run Edge Function unit tests (fakes only)
        run: node --test --experimental-strip-types supabase/functions/tests/handlers.test.ts

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run public-site browser tests against mocked services
        run: |
          python3 -m http.server 8765 > /tmp/stage8-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          SITE=http://localhost:8765/index.html node tests/stage8-public.test.js
          SITE_ROOT=http://localhost:8765 node tests/admin-access.test.js

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run isolated Stage 8 database suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/run_tests.sh
