# Supabase CLI config for the YARED portfolio Stage 8 development project.
# Public visitor functions enforce the configured origin allow-list, spam checks,
# rate limits and server-side validation. Worker and webhook routes require secrets.
project_id = "lyeccydsfwjtxhpkhukh"

[functions.submit-booking]
verify_jwt = false
[functions.submit-feedback]
verify_jwt = false
[functions.track-event]
verify_jwt = false
[functions.process-notifications]
verify_jwt = false
[functions.whatsapp-webhook]
verify_jwt = false

[auth]
# Owner account only; create the owner after disabling public signup in Auth settings.
enable_signup = false
